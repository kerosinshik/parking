[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkan"
version = "0.1.0"
description = "Аналитика загрузки парковок и нарушений парковки по районам Москвы (MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
channel = ["pillow>=10"]   # карточки постов для Telegram-канала
bot = ["pillow>=10", "playwright>=1.40"]   # картинки бота-дорвея: Pillow и Chromium Playwright

[project.scripts]
parkan = "parkan.cli:main"

[tool.setuptools.packages.find]
include = ["parkan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
