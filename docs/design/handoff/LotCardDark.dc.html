<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="data/moscow-geo.js"></script>
<style>body{margin:0;font-family:Onest,sans-serif}a{color:#C8F04A}a:hover{color:#F6F4EE}</style>
</helmet>
<div style="width:1080px;height:1080px;background:#0E3B2E;position:relative;overflow:hidden;font-family:Onest,sans-serif;padding:68px 76px 68px;box-sizing:border-box;display:flex;flex-direction:column">
<div style="position:absolute;right:24px;top:128px;width:560px;height:600px">
<svg viewBox="0 0 560 600" width="560" height="600" style="display:block;overflow:hidden;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)">
<sc-for list="{{ paths }}" as="p" hint-placeholder-count="0"><path d="{{ p.d }}" fill="{{ p.fill }}" stroke="#0E3B2E" stroke-width="1.3" stroke-linejoin="round"></path></sc-for>
</svg>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;position:relative">
<div style="background:#C8F04A;color:#0E3B2E;font:700 30px Onest;letter-spacing:0.04em;padding:12px 26px;border-radius:40px">{{ kicker }}</div>
<div style="font:700 28px Unbounded;color:#F6F4EE;letter-spacing:0.06em">{{ brand }}</div>
</div>
<div style="position:relative;margin-top:110px;max-width:470px;display:flex;flex-direction:column">
<div style="font:800 132px/1 Unbounded;color:#C8F04A;letter-spacing:-0.04em;white-space:nowrap">{{ headline }}</div>
<div style="font:500 36px/1.2 Onest;color:#CFE0D6;margin-top:22px;text-wrap:pretty">{{ headlineSub }}</div>
<div style="align-self:flex-start;margin-top:32px;border:2px solid #C8F04A;color:#C8F04A;font:600 28px Onest;padding:10px 22px;border-radius:40px">{{ deadline }}</div>
</div>
<div style="margin-top:auto;position:relative;border-top:2px solid #2B5A49;padding-top:40px;display:grid;grid-template-columns:230px minmax(0,1fr);column-gap:48px;align-items:center">
<div style="width:230px;height:230px;position:relative">
<sc-if value="{{ showImg }}" hint-placeholder-val="{{ true }}"><img src="{{ illusSrc }}" onError="{{ onImgError }}" style="width:100%;height:100%;object-fit:contain;display:block;transform:scale({{ imgScale }})" alt=""></sc-if>
<sc-if value="{{ showPlaceholder }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;border:3px dashed #2B6B52;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;box-sizing:border-box"><div style="font:600 26px Onest;color:#CFE0D6">{{ typeLabel }}</div><div style="font:500 20px Onest;color:#7FA393">{{ illusSrc }}</div></div></sc-if>
</div>
<div style="display:flex;flex-direction:column;min-width:0">
<div style="font:700 74px/1 Unbounded;color:#F6F4EE;letter-spacing:-0.03em;white-space:nowrap">{{ price }}</div>
<div style="font:500 30px/1.25 Onest;color:#A9C4B6;margin-top:14px">{{ priceSub }}</div>
<div style="font:700 34px/1.2 Onest;color:#F6F4EE;margin-top:26px;text-wrap:pretty">{{ address }}</div>
<div style="font:500 28px Onest;color:#A9C4B6;margin-top:8px">{{ districtLine }}</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;parking&quot;,&quot;flat&quot;,&quot;storage&quot;,&quot;commercial&quot;],&quot;default&quot;:&quot;parking&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;district&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Бескудниковский&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ЛОТ ДНЯ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;−44%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headlineSub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;дешевле медианы района&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deadline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;заявки до 9 ноября&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1,29 млн ₽&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;priceSub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;медиана — 2,30 млн ₽ · 14,9 м²&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Бескудниковский бульвар, 19, стр. 1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;С МОЛОТКА&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;useUrl&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { geo: window.MOSCOW_GEO || null, imgFailed: false, lastSrc: null };
  componentDidMount() {
    if (!this.state.geo) this._t = setInterval(() => { if (window.MOSCOW_GEO) { clearInterval(this._t); this.setState({ geo: window.MOSCOW_GEO }); } }, 100);
  }
  componentWillUnmount() { clearInterval(this._t); }
  param(k, d) {
    const q = this.props.useUrl === false ? null : new URLSearchParams(location.search);
    return (q && q.get(k)) ?? this.props[k] ?? d;
  }
  norm(s) { return (s || '').toLowerCase().replace(/ё/g, 'е').replace(/район/g, '').replace(/[^a-zа-я0-9]+/g, ''); }
  renderVals() {
    const type = this.param('type', 'parking');
    const TYPES = { parking: 'машино-место', flat: 'квартира', storage: 'кладовая', commercial: 'нежилое' };
    const district = this.param('district', 'Бескудниковский');
    const geo = this.state.geo;
    let paths = [], okrug = '', dName = district;
    if (geo) {
      const ds = geo.districts;
      const hit = ds.find(d => this.norm(d.n) === this.norm(district));
      okrug = hit ? hit.o : '';
      if (hit) dName = hit.n;
      const outer = ['ЗелАО', 'НАО', 'ТАО'];
      const shown = !hit || !outer.includes(hit.o) ? ds.filter(d => !outer.includes(d.o))
        : hit.o === 'ЗелАО' ? ds.filter(d => d.o !== 'НАО' && d.o !== 'ТАО') : ds.filter(d => d.o !== 'ЗелАО');
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      const k = Math.cos(55.75 * Math.PI / 180);
      const focus = hit ? ds.filter(d => d.o === hit.o) : shown;
      focus.forEach(d => d.r.forEach(r => r.forEach(([lo, la]) => { const x = lo * k, y = -la; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; })));
      const W = 560, H = 600, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const span = Math.max((x1 - x0) / W, (y1 - y0) / H, 0.24 * k / W) * 1.6;
      const s = 1 / span;
      const P = (lo, la) => [W / 2 + (lo * k - cx) * s, H / 2 + (-la - cy) * s];
      paths = shown.map(d => ({
        d: d.r.map(r => 'M' + r.map(([lo, la]) => P(lo, la).map(v => v.toFixed(1)).join(',')).join('L') + 'Z').join(''),
        fill: d === hit ? '#C8F04A' : d.o === okrug ? '#3A7A60' : '#1A4F3F',
        z: d === hit ? 2 : d.o === okrug ? 1 : 0
      })).sort((a, b) => a.z - b.z);
    }
    const illusSrc = this.param('img', 'assets/' + type + '.png');
    const failed = this.state.imgFailed && this.state.lastSrc === illusSrc;
    return {
      paths,
      kicker: this.param('kicker', 'ЛОТ ДНЯ'),
      brand: this.param('brand', 'С МОЛОТКА'),
      headline: this.param('headline', '−44%'),
      headlineSub: this.param('headlineSub', 'дешевле медианы района'),
      deadline: this.param('deadline', 'заявки до 9 ноября'),
      price: this.param('price', '1,29 млн ₽'),
      priceSub: this.param('priceSub', 'медиана — 2,30 млн ₽ · 14,9 м²'),
      address: this.param('address', 'Бескудниковский бульвар, 19, стр. 1'),
      districtLine: [/район$/.test(dName) ? dName : 'район ' + dName, okrug].filter(Boolean).join(' · '),
      typeLabel: TYPES[type] || type,
      imgScale: { parking: 1.9 }[type] || 1, illusSrc, showImg: !failed, showPlaceholder: failed,
      onImgError: () => this.setState({ imgFailed: true, lastSrc: illusSrc })
    };
  }
}
</script>
</body>
</html>
